[workspace]
resolver = "3"
members = ["crates/iat-av1", "crates/iat-core", "crates/iat-cli", "crates/iat-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["Kaido-MSVC"]
publish = false

# 版本變更要同步記在 docs/dependencies.md。
[workspace.dependencies]
iat-av1 = { path = "crates/iat-av1" }
iat-core = { path = "crates/iat-core" }
# 只放 dev-dependencies：PSD／PSB 的交叉比對（規劃書，D-R16）
apeireth-image-psd = { version = "2.0.0-rc.5", default-features = false }
image-webp = "0.2.4"
# 階段 5：JPEG XL 解碼（jxl-rs，D-R18）
jxl = "0.8.0"
# 階段 6：AV1 解碼（rav1d，D-R09）；不編入組合語言，只開 8／16 位元
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
crc32fast = "1.5.5"
miniz_oxide = "0.8.9"
png = "0.18.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# 階段 4：TIFF 的 LZW 解壓（D-R17）
weezl = "0.1.12"
# GUI：預設 feature 換成明確清單；繪圖用 FemtoVG（WGPU，純 Rust，D-R14），winit 後端（拖放要接 winit 事件）
slint = { version = "1.19.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "accessibility",
    "unstable-winit-030",
] }
slint-build = "1.19.0"
# 介面語言的預設值；Slint 已經依賴同一版
sys-locale = "0.3.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security_Cryptography",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# `let _ = 會失敗的呼叫` 會默默丟掉錯誤；要丟就明說理由。
let_underscore_must_use = "warn"

[profile.release]
lto = true
codegen-units = 1
