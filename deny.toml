# cargo-deny 設定（docs/plan.md「授權白名單」）。`cargo deny check` 必須通過。

[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
# 只允許寬鬆授權；GPL、AGPL 與任何商業授權都不在清單內，一律失敗。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "NCSA",
]
confidence-threshold = 0.93
# 白名單是政策，不是目前用到的清單：沒用到的項目不警告。
unused-allowed-license = "allow"
# 例外只開給特定 crate：
# - Slint（階段 2 加入）：宣告為 GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0，
#   採用免版稅授權。加入時把 slint 及其 i-slint-* 子 crate 逐一列出，allow 只放 "LicenseRef-Slint-Royalty-free-2.0"。
# - MPL-2.0：只允許測試對照用的 dev-dependency（例如 avif-parse），加入時以 crate 名稱個別列出，
#   並確認它只出現在 [dev-dependencies]。
exceptions = []

[licenses.private]
# workspace 自己的 crate（publish = false）不檢查。
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace 內的 path 依賴（iat-core）不算萬用版本；只對 publish = false 的 crate 生效。
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# 需要網路抓 RustSec 資料庫；離線時以 `cargo deny check licenses bans sources` 代替。
yanked = "deny"
